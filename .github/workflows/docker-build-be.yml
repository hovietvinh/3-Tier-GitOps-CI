name: Build BE image
on:
  push:
    branches:
      - dev
    paths:
      - 'api/**'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

permissions:
  contents: write
env:
  IMAGE_TAG: ${{ github.sha }}
jobs:
  resolve_env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - name: Map branch to environment
        id: map
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            BRANCH="${{ github.ref_name }}"
            case "$BRANCH" in
              dev) echo "environment=dev" >> $GITHUB_OUTPUT ;;
              *) echo "environment=dev" >> $GITHUB_OUTPUT ;;
            esac
          fi
  
  build_backend_docker_image_and_push:
    runs-on: ubuntu-latest
    needs: resolve_env
    environment: ${{needs.resolve_env.outputs.environment}}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            hovietvinh29032004/backend:latest
            hovietvinh29032004/backend:${{ env.IMAGE_TAG }}
