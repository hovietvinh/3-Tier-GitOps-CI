name: Build BE image
on:
  push:
    branches:
      - dev
    paths:
      - 'api/**'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

permissions:
  contents: write
env:
  IMAGE_TAG: ${{ github.sha }}
jobs:
  resolve_env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - name: Map branch to environment
        id: map
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            BRANCH="${{ github.ref_name }}"
            case "$BRANCH" in
              dev) echo "environment=dev" >> $GITHUB_OUTPUT ;;
              *) echo "environment=dev" >> $GITHUB_OUTPUT ;;
            esac
          fi
  
  build_backend_docker_image_and_push:
    runs-on: ubuntu-latest
    needs: resolve_env
    environment: ${{needs.resolve_env.outputs.environment}}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            hovietvinh29032004/backend:latest
            hovietvinh29032004/backend:${{ env.IMAGE_TAG }}
      
  update_cd_repo:
    runs-on: ubuntu-latest
    needs: [build_backend_docker_image_and_push, resolve_env]
    environment: ${{needs.resolve_env.outputs.environment}}
    env:
      CD_REPO_TOKEN: ${{ secrets.CD_REPO_TOKEN }}
    steps:
      - name: Checkout CD repo
        uses: actions/checkout@v4

        with:
          repository: hovietvinh/3-Tier-GitOps-CD
          ref: dev
          token: ${{ env.CD_REPO_TOKEN }}
          path: cd
      
      - name: Bump images in manifests (safe)
        working-directory: cd
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o yq && sudo install yq /usr/local/bin/yq

          # -- Safety cleanup: remove any accidental .spec.template from Service docs
          yq -i '(. | select(.kind=="Service")) |= del(.spec.template)' k8s/backend.yaml

          # -- Update ONLY Deployment images (backend)
          yq -i '
            (. | select(.kind=="Deployment")
               | .spec.template.spec.containers[]
               | select(.name=="backend")
               | .image)
            = "hovietvinh29032004/backend:" + strenv(IMAGE_TAG)
          ' k8s/backend.yaml
      - name: Commit & push to CD repo
        working-directory: cd
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "bump images to ${IMAGE_TAG}" || echo "no changes"
          git push